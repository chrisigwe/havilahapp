<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#101613" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#e8a13d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Havilah App" />
    <title>Havilah App</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Crash screen of last resort.
         This has to live here, as a plain inline script, rather than in
         main.jsx: ES modules all evaluate before the entry file's own
         body runs, so a module that throws while loading (a bad import,
         a half-updated file from the cache) crashes the page before any
         handler registered in JavaScript exists. The result was a black
         screen with nothing to read and nothing to tap. Registered here
         it runs first, so there is always a message and a way out. -->
    <script>
      (function () {
        var shown = false
        window.__havilahFatal = function (err) {
          if (shown) return
          var root = document.getElementById('root')
          if (!root) return
          shown = true
          var detail = [(err && err.message) || String(err), (err && err.stack) || ''].filter(Boolean).join('\n\n')
          root.innerHTML =
            '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;'
            + 'justify-content:center;gap:14px;padding:24px;text-align:center;background:#101613;'
            + 'color:#ede9dc;font-family:system-ui,sans-serif">'
            + '<p style="font-size:18px;font-weight:700;margin:0">The app could not start.</p>'
            + '<p style="color:#96a49b;max-width:20rem;margin:0">Tap Clear and reload — that fixes a '
            + 'half-updated app. If it keeps happening, copy the details and send them.</p>'
            + '<button id="hv-hard" style="height:56px;padding:0 24px;border-radius:16px;border:0;'
            + 'background:#e8a13d;color:#101613;font-weight:700;font-size:16px">Clear and reload</button>'
            + '<button id="hv-reload" style="height:46px;padding:0 20px;border-radius:14px;background:none;'
            + 'border:1px solid #2c3a32;color:#96a49b;font-size:14px">Just reload</button>'
            + '<pre id="hv-detail" style="width:100%;max-width:24rem;text-align:left;font-size:11px;'
            + 'color:#96a49b;background:#1b241f;border:1px solid #2c3a32;border-radius:12px;padding:12px;'
            + 'max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word"></pre>'
            + '<button id="hv-copy" style="height:44px;padding:0 20px;border-radius:14px;background:none;'
            + 'border:1px solid #2c3a32;color:#ede9dc;font-size:14px">Copy details to send</button>'
            + '</div>'
          document.getElementById('hv-detail').textContent = detail
          document.getElementById('hv-reload').onclick = function () { window.location.reload() }
          document.getElementById('hv-copy').onclick = function (e) {
            if (navigator.clipboard) navigator.clipboard.writeText(detail)
            e.target.textContent = 'Copied'
          }
          // Throws away the service worker and every cached file, which is
          // what an update that only half arrived actually needs.
          document.getElementById('hv-hard').onclick = function () {
            var done = function () { window.location.reload() }
            try {
              var jobs = []
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister() }))
                }))
              }
              if (window.caches) {
                jobs.push(caches.keys().then(function (ks) {
                  return Promise.all(ks.map(function (k) { return caches.delete(k) }))
                }))
              }
              Promise.all(jobs).then(done, done)
            } catch (x) { done() }
          }
        }
        // A HALF-UPDATED APP, HEALED WITHOUT ANYONE HAVING TO KNOW WHY.
        //
        // After a deploy the old hashed .js files are gone from the
        // server. A browser still holding the previous index.html asks
        // for a file that no longer exists, and the module script fails
        // to load. That failure is a RESOURCE error: it carries no
        // .error, and it does not bubble — so the handler below only
        // ever saw it once it listened in the capture phase. Until
        // then nothing fired, nothing rendered, and the page sat on the
        // background colour. That is the black screen.
        //
        // Now the first such failure clears the service worker and every
        // cached file and reloads once, which is exactly what a
        // half-arrived update needs. The flag makes it once only: if the
        // app still cannot start, the person gets the screen with
        // something to read and something to tap, rather than a reload
        // loop. main.jsx clears the flag as soon as the app mounts.
        var RECOVERY_KEY = 'hv-recovery-attempted'
        window.__havilahRecover = function (what) {
          var tried = false
          try { tried = sessionStorage.getItem(RECOVERY_KEY) === '1' } catch (x) { tried = false }
          if (tried) {
            window.__havilahFatal(new Error(
              'The app files could not be loaded, even after clearing.\n' + (what || '')))
            return
          }
          try { sessionStorage.setItem(RECOVERY_KEY, '1') } catch (x) { /* private mode */ }
          var done = function () { window.location.reload() }
          try {
            var jobs = []
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister() }))
              }))
            }
            if (window.caches) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k) }))
              }))
            }
            Promise.all(jobs).then(done, done)
          } catch (x) { done() }
        }
        // Capture phase: resource errors do not bubble, so without the
        // third argument this never sees the one failure that matters.
        window.addEventListener('error', function (e) {
          if (e.error) { window.__havilahFatal(e.error); return }
          var t = e.target
          if (!t || !t.tagName) return
          var src = t.src || t.href || ''
          // OUR OWN FILES ONLY. The first version of this treated any
          // failed resource as a half-updated app — including the Google
          // Fonts stylesheet, which fails whenever that host is slow or
          // blocked. A missing font would then have wiped the cache and
          // shown a crash screen. A font that will not load is a font
          // that will not load; the app is fine without it.
          if (src.indexOf(location.origin + '/') !== 0) return
          if (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'stylesheet')) {
            window.__havilahRecover(src)
          }
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          // A dynamic import of a chunk the deploy removed rejects here
          // rather than firing a resource error.
          var m = (e.reason && (e.reason.message || String(e.reason))) || ''
          if (/dynamically imported module|Importing a module script failed|Failed to fetch dynamically/i.test(m)) {
            window.__havilahRecover(m)
            return
          }
          window.__havilahFatal(e.reason)
        })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
